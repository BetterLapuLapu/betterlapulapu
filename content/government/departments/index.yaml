# Department Pages
# This file contains all the pages/governments available under the Department.
# Each page's `group` puts it under one of the headings below on the
# departments page; pages without one are listed under "Other offices".

groups:
  - slug: 'executive-legislative'
    name: 'Executive and legislative'
  - slug: 'city-offices'
    name: 'City offices'
  - slug: 'hospitals'
    name: 'Hospitals'
  - slug: 'education'
    name: 'Schools, training and library'

pages:
  - name: 'Mayor and Vice Mayor'
    slug: 'executive'
    group: 'executive-legislative'
    description: "Find out about your Mayor and Vice Mayor, including upcoming events, the Mayor's Community Assistance Program, mayoral history, and information about other historic roles in the local government unit."
  - name: 'City Council (Sangguniang Panlungsod)'
    slug: 'legislative'
    group: 'executive-legislative'
    description: 'As of the 2025–2028 term, the Sangguniang Panlungsod (City Council) of Lapu-Lapu City has 12 elected councilors, with the Vice Mayor as the presiding officer of the council.'
  - name: 'Barangays and Barangay Officials'
    slug: 'barangays'
    group: 'executive-legislative'
    description: 'The 30 barangays of Lapu-Lapu City with their punong barangays and SK chairpersons for the 2023–2026 term, plus what barangay officials do.'

  # City offices and other units (from the Citizen's Charter)
  - name: 'Office of the City Mayor'
    slug: 'city-mayors-office'
    group: 'executive-legislative'
    description: 'Special permits for events, venue rentals, banners and deliveries; certifications for work and travel; marriage solemnization schedules; the board and bar passer incentive; and senior citizen cash gift re-payroll.'
  - name: 'Office of the City Administrator'
    slug: 'city-administrators-office'
    group: 'executive-legislative'
    description: "Occupational permits (Mayor's Permit for Employment), Mayor's Clearance for the uniformed services, and the Committee on Discipline and Investigation for complaints against government employees."
  - name: 'Office of the City Attorney'
    slug: 'city-attorneys-office'
    group: 'city-offices'
    description: "Issues, renews and amends the Motorized Tricycle Operator's Permit (MTOP). Open Monday to Friday, 8:00 AM to 5:00 PM."
  - name: 'Office of the City Treasurer'
    slug: 'city-treasurers-office'
    group: 'city-offices'
    description: 'Pay real property tax, business tax and other local fees; get real property tax clearances and certifications; close a registered business.'
  - name: 'Office of the City Assessor'
    slug: 'city-assessors-office'
    group: 'city-offices'
    description: 'Tax declarations, re-assessments, annotations, property certifications and lot maps. Ground Floor, City Hall Main Bldg., Pusok.'
  - name: "City Accountant's Office"
    slug: 'city-accountants-office'
    group: 'city-offices'
    description: 'Processes city payrolls and payments to suppliers and contractors, and issues certifications, city clearances and BIR tax credit forms.'
  - name: 'City Budget Office'
    slug: 'city-budget-office'
    group: 'city-offices'
    description: 'Prepares the city budget, releases allotments, certifies available funds, reviews barangay and SK budgets, and provides copies of budget documents.'
  - name: 'City General Services Office (CGSO)'
    slug: 'city-general-services-office'
    group: 'city-offices'
    description: 'Bidding documents and purchase orders for suppliers, records from the city archives, and supplies, property and maintenance services for city offices.'
  - name: 'City Engineering Office and Office of the Building Official'
    slug: 'city-engineering-office'
    group: 'city-offices'
    description: 'Building permits and certificates of occupancy under the National Building Code (PD 1096).'
  - name: 'City Planning and Development Office (CPDO)'
    slug: 'city-planning-and-development-office'
    group: 'city-offices'
    description: 'Locational clearances, zoning and land use certifications, and subdivision permits. Quezon National Highway, Pajo.'
  - name: 'City Environment and Natural Resources Office (CENRO)'
    slug: 'city-environment-and-natural-resources-office'
    group: 'city-offices'
    description: 'Fishing, hauling, research and tree-cutting permits, garbage collection, environmental complaints, wildlife turn-over, seed distribution, cleanups and seminars.'
  - name: 'City Traffic Management System (CTMS)'
    slug: 'city-traffic-management-office'
    group: 'city-offices'
    description: 'Traffic management and enforcement: pay traffic violation fines, settle traffic disputes, and claim towed or impounded vehicles.'
  - name: 'City Social Welfare and Development Office'
    slug: 'city-social-welfare-and-development-office'
    group: 'city-offices'
    description: 'Crisis assistance, daycare, disaster relief, senior citizen, solo parent and PWD IDs and cash gifts, and support for women, children and families. Open Monday to Friday, 8:00 AM to 5:00 PM.'
  - name: 'City Veterinary Office'
    slug: 'city-veterinary-office'
    group: 'city-offices'
    description: 'Free dog and cat registration and anti-rabies shots, pet surrender and adoption, stray animal impounding, and slaughterhouse meat inspection. Sitio Seabreeze, Pusok; tel. 341-2612.'
  - name: 'Local Civil Registrar'
    slug: 'local-civil-registrar'
    group: 'city-offices'
    description: 'Register births, marriages and deaths, get certified copies and PSA documents, correct records, and apply for a marriage license. 2nd Floor, City Library Building, Government Center.'
  - name: 'Public Employment Service Office (PESO)'
    slug: 'public-employment-service-office'
    group: 'city-offices'
    description: 'Free job referral and placement, employer accreditation and job fairs, summer jobs for youth, the Government Internship Program and career guidance. Tel. (032) 492 3249.'
  - name: 'Manpower and Human Development Training Center'
    slug: 'manpower-and-human-development-training-center'
    group: 'education'
    description: 'Free industrial high-speed sewing and dressmaking training for Lapu-Lapu City residents and registered voters.'
  - name: 'Market and Slaughterhouse Division'
    slug: 'market-and-slaughterhouse-division'
    group: 'city-offices'
    description: 'Runs the public market and slaughterhouse: stall rent and electricity payments, market clearances, cash tickets and slaughter fees.'
  - name: 'Urban Poor Affairs Office (UPAO)'
    slug: 'urban-poor-affairs-office'
    group: 'city-offices'
    description: 'Free accreditation of urban poor associations and certificates for electrical permits for their members. Tel. 517-9926.'
  - name: 'Lapu-Lapu City Hospital'
    slug: 'lapu-lapu-city-hospital'
    group: 'hospitals'
    description: 'Emergency care, outpatient consultations, laboratory, X-ray and other imaging, Malasakit Center assistance, billing and medical records. A. Tumulak St., Gun-ob; tel. (032) 340-0248.'
  - name: 'Sta. Rosa Community Hospital'
    slug: 'sta-rosa-community-hospital'
    group: 'hospitals'
    description: 'PhilHealth-accredited Level 1 hospital in Olango with 24/7 emergency and ward services, outpatient consultations and medical records.'
  - name: 'Lapu-Lapu City College'
    slug: 'lapu-lapu-city-college'
    group: 'education'
    description: 'Office of the Registrar: enrollment, transcripts, certifications, CAV endorsements and replacement diplomas.'
  - name: 'Lapu-Lapu City Library'
    slug: 'lapu-lapu-city-library'
    group: 'education'
    description: 'Free library membership and book borrowing for residents. 2nd Floor, City Library Building, Government Center, Pusok; open Monday to Friday, 8:00 AM to 5:00 PM.'
  - name: 'Office of the Secretary to the Sangguniang Panlungsod'
    slug: 'sangguniang-panlungsod-secretariat'
    group: 'executive-legislative'
    description: 'Certified true copies of approved ordinances and resolutions, replies to letters of inquiry, and certification of notices posted on the council bulletin board.'
